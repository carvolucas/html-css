<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        div.conteiner {
            background-color: greenyellow;
            
            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: blueviolet;
            border: 1px solid white;
            text-align: center;
            color: white;
            flex-basis: 150px;
        }

    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">Lorem ipsum dolor sit amet</div>
        <div class="item">C</div>
        <div class="item">Lorem ipsum dolor sit amet consectetur adipisicing elit. Debitis officia tempora voluptatem, possimus illo velit, asperiores unde esse molestiae facere delectus quisquam placeat voluptatum? Eligendi ipsum quas odit blanditiis unde!</div>
        <div class="item">E</div>
        <div class="item">Lorem ipsum.</div>
        <div class="item">G</div>
    </div>
</body>
</html>
